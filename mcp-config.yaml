# Merge this entry into the active Hermes profile; preserve other configuration.
mcp_servers:
  scrapeless:
    command: npx
    args: ["-y", "scrapeless-mcp-server@0.6.3"]
    env:
      SCRAPELESS_API_KEY: "${SCRAPELESS_API_KEY}"
    enabled: true
    tools:
      include:
        - ai_scraper
        - google_search
        - browser_create
        - browser_close
        - browser_goto
        - browser_go_back
        - browser_go_forward
        - browser_click
        - browser_type
        - browser_press_key
        - browser_wait_for
        - browser_wait
        - browser_snapshot
        - browser_screenshot
        - browser_get_html
        - browser_get_text
        - browser_scroll
        - browser_scroll_to
        - scrape_html
        - scrape_markdown
        - scrape_screenshot
        - google_trends
        - crawl_start
        - crawl_result
        - crawl_cancel
      resources: false
      prompts: false

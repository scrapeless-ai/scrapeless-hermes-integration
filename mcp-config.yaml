# Merge this entry into the active Hermes profile; preserve other configuration.
mcp_servers:
  scrapeless:
    command: npx
    args: ["-y", "scrapeless-mcp-server@0.6.3"]
    env:
      SCRAPELESS_API_KEY: "${SCRAPELESS_API_KEY}"
    enabled: true
    tools:
      include:
        - google_search
        - scrape_markdown
        - browser_create
        - browser_goto
        - browser_get_text
        - browser_click
        - browser_close
      resources: false
      prompts: false
